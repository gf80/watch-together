<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Watch Together — смотрим вместе</title>
    <link rel="stylesheet" href="/static/css/app.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <main class="lobby">
      <header class="lobby-head">
        <div>
          <h1>Посмотрим вместе</h1>
          <div class="muted" style="font-size: 14px">
            Общая пауза, синхронизация и чат — всё, чтобы смотреть вместе.
          </div>
        </div>
      </header>

      <section class="card lobby-form">
        <label>
          <span>Как вас зовут</span>
          <input type="text" id="name" maxlength="32" placeholder="Например, Саша" />
        </label>
        <label>
          <span>Название комнаты (необязательно)</span>
          <input type="text" id="title" maxlength="80" placeholder="Пятничный киноманан" />
        </label>
        <button class="btn primary" id="create" style="height: 42px">
          <svg class="ic fill"><use href="#i-play-circle" /></svg>
          Создать комнату
        </button>
      </section>

      <section class="row rooms-head">
        <h2 class="grow">Открытые комнаты</h2>
        <button class="btn refresh" id="refresh" title="Обновить список" aria-label="Обновить список">
          <svg class="ic"><use href="#i-refresh" /></svg>
          <span>Обновить</span>
        </button>
      </section>

      <div id="rooms" class="muted">Загрузка…</div>
    </main>

    <div class="toast-host" id="toasts"></div>
    <script src="/static/js/common.js"></script>
    <script src="/static/js/lobby.js"></script>
  </body>
</html>
